<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RWAKS Automotives - Login</title>
    <link rel="stylesheet" href="1styles.css">
</head>
<body>
    <div class="login-container">
      <div class="login-box">
        <h1>RWAKS Automotives</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Login to view our inventory</p>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit" class="login-btn">Login</button>
        </form>
        <div id="message" class="message"></div>
        <p class="hint">
          Demo credentials: <strong>username</strong> /
          <strong>password123</strong>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
</body>
